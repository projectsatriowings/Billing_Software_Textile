<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Adaptive Billing — Retail, Supermarket & Wholesale POS</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6D28D9" />
  <link id="app-favicon" rel="icon" type="image/png" sizes="any" href="/icon.png?v=20261123c" />
  <link rel="shortcut icon" href="/favicon.ico?v=20261123c" />
  <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/icon.png?v=20261123c" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/bundle.css?v=32">
</head>

<body>
  <div id="root">
    <!-- Instant Shell Splash Screen (<50ms paint while bundle loads) -->
    <div id="initial-splash-screen"
      style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fdfafd; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
      <div
        style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #49364A 0%, #604B61 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(73, 54, 74, 0.28); margin-bottom: 20px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
      </div>
      <div style="font-size: 19px; font-weight: 800; color: #1e1520; letter-spacing: -0.02em;">Adaptive Billing POS
      </div>
      <div style="font-size: 13px; color: #64748b; margin-top: 6px; font-weight: 500;">Loading enterprise cloud
        workstation...</div>
      <div
        style="width: 140px; height: 4px; background: #E9DFE9; border-radius: 9999px; overflow: hidden; margin-top: 22px;">
        <div
          style="width: 100%; height: 100%; background: #49364A; border-radius: 9999px; animation: billingShimmer 1.2s infinite ease-in-out;">
        </div>
      </div>
      <style>
        @keyframes billingShimmer {
          0% {
            transform: translateX(-100%);
          }

          100% {
            transform: translateX(100%);
          }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/bundle.js?v=32"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>

</html>
