<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adaptive Billing | India-First Cloud POS & GST Invoicing</title>
  <link id="app-favicon" rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/bundle.css?v=14">
</head>
<body>
  <div id="root">
    <!-- Instant Shell Splash Screen (<50ms paint while bundle loads) -->
    <div id="initial-splash-screen" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8f7ff; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(79, 70, 229, 0.28); margin-bottom: 20px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <div style="font-size: 19px; font-weight: 800; color: #0f172a; letter-spacing: -0.02em;">Adaptive Billing POS</div>
      <div style="font-size: 13px; color: #64748b; margin-top: 6px; font-weight: 500;">Loading enterprise cloud workstation...</div>
      <div style="width: 140px; height: 4px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; margin-top: 22px;">
        <div style="width: 100%; height: 100%; background: #4f46e5; border-radius: 9999px; animation: billingShimmer 1.2s infinite ease-in-out;"></div>
      </div>
      <style>
        @keyframes billingShimmer {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(100%); }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/bundle.js?v=14"></script>
</body>
</html>
